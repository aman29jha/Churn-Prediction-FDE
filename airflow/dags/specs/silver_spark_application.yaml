# SparkApplication for the Bronze -> Silver job. Submitted by
# medallion_pipeline_dag via SparkKubernetesOperator. See
# docs/architecture/{01-data-platform,03-orchestration}.md.
#
# Image tag is hardcoded here deliberately — per docs/architecture/08-infrastructure.md's
# versioning section, the image version for batch jobs lives in this
# git-synced file, not in a mutable `:latest` tag (ECR repos are
# IMMUTABLE tag mutability). Bump this line + commit to change which
# image future runs use; already-running/completed runs are unaffected.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: silver-transform
  namespace: churn-service
spec:
  type: Python
  mode: cluster
  image: "784004375291.dkr.ecr.ap-south-1.amazonaws.com/churn-fde-sandbox-spark-jobs:sha-359d713-amd64"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///app/scripts/spark_job_entrypoint.py
  arguments:
    - "silver"
    - "--input"
    - "s3a://churn-fde-sandbox-data-lake-784004375291/bronze/"
    - "--output"
    - "s3a://churn-fde-sandbox-data-lake-784004375291/silver/events/"
    - "--iceberg-catalog-db"
    - "glue_catalog.churn_fde_sandbox"
  sparkVersion: "3.4.0"
  sparkConf:
    spark.eventLog.enabled: "true"
    spark.eventLog.dir: "s3a://churn-fde-sandbox-data-lake-784004375291/spark-events/"
    spark.hadoop.fs.s3a.aws.credentials.provider: "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"
    spark.sql.session.timeZone: "UTC"
    spark.sql.extensions: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    # Real, genuine Iceberg-on-Glue registration — found missing entirely
    # (docs described it, the write path never did it: plain
    # df.write.parquet() to a raw S3 path, zero Glue tables ever created).
    # spark_catalog (the default, unnamed catalog) is deliberately left
    # alone; this registers a second, explicitly-named catalog so existing
    # plain-Parquet reads/writes at the same S3 paths are unaffected.
    spark.sql.catalog.glue_catalog: "org.apache.iceberg.spark.SparkCatalog"
    spark.sql.catalog.glue_catalog.catalog-impl: "org.apache.iceberg.aws.glue.GlueCatalog"
    spark.sql.catalog.glue_catalog.io-impl: "org.apache.iceberg.aws.s3.S3FileIO"
    spark.sql.catalog.glue_catalog.warehouse: "s3://churn-fde-sandbox-data-lake-784004375291/warehouse/"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 0
  # labels is REQUIRED here (even empty) — see gold/analytics specs for why:
  # the Airflow SparkKubernetesOperator crashes with KeyError: 'labels'
  # without it.
  driver:
    cores: 1
    memory: "1g"
    serviceAccount: spark-jobs
    labels:
      app: silver-transform
    nodeSelector:
      workload-type: spark-driver
    tolerations:
      - key: workload-type
        operator: Equal
        value: spark-driver
        effect: NoSchedule
  executor:
    cores: 1
    instances: 1
    memory: "1g"
    labels:
      app: silver-transform
    nodeSelector:
      workload-type: spark-executor
    tolerations:
      - key: workload-type
        operator: Equal
        value: spark-executor
        effect: NoSchedule
