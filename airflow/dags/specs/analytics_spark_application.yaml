# SparkApplication for the analytics batch pipeline (KPI trends, segment
# migration, cohort retention). See docs/architecture/07-analytics.md.
# Daily, time-based — deliberately decoupled from the event-triggered
# medallion_pipeline_dag's cadence.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: analytics-transform
  namespace: churn-service
spec:
  type: Python
  mode: cluster
  image: "784004375291.dkr.ecr.ap-south-1.amazonaws.com/churn-fde-sandbox-spark-jobs:sha-e696da2-amd64"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///app/scripts/spark_job_entrypoint.py
  # Real bug found by actually triggering this for the first time (it had
  # never been run before): the previous "gold" placeholder arg would have
  # crashed immediately on submission — the gold job requires --model and
  # --baseline and raises SystemExit without them, neither of which this
  # spec ever passed. Now uses the real, distinct "analytics" entrypoint
  # mode (src/spark_jobs/analytics_transform.py), which only implements
  # kpi_daily so far — see that module's docstring for why
  # segment_migration/cohort_retention aren't done yet (they need Gold's
  # tables to be append-only/partitioned by run_date first, a separate
  # change not made in this pass).
  arguments:
    - "analytics"
    - "--input"
    - "s3a://churn-fde-sandbox-data-lake-784004375291/silver/events/"
    - "--output"
    - "s3a://churn-fde-sandbox-data-lake-784004375291/gold/analytics/"
    - "--iceberg-catalog-db"
    - "glue_catalog.churn_fde_sandbox"
  sparkVersion: "3.4.0"
  sparkConf:
    spark.eventLog.enabled: "true"
    spark.eventLog.dir: "s3a://churn-fde-sandbox-data-lake-784004375291/spark-events/"
    spark.hadoop.fs.s3a.aws.credentials.provider: "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"
    spark.sql.session.timeZone: "UTC"
    spark.sql.extensions: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    spark.sql.catalog.glue_catalog: "org.apache.iceberg.spark.SparkCatalog"
    spark.sql.catalog.glue_catalog.catalog-impl: "org.apache.iceberg.aws.glue.GlueCatalog"
    spark.sql.catalog.glue_catalog.io-impl: "org.apache.iceberg.aws.s3.S3FileIO"
    spark.sql.catalog.glue_catalog.warehouse: "s3://churn-fde-sandbox-data-lake-784004375291/warehouse/"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 1
  # labels is REQUIRED here (even empty) — not a Spark Operator requirement,
  # but the Airflow provider's SparkKubernetesOperator/custom_object_launcher
  # reads spec.driver.labels directly off the create-CR API response to build
  # its own driver-pod watcher; a manifest without this key crashes with
  # `KeyError: 'labels'` right after CR creation (found by running
  # `airflow tasks test` synchronously — the KubernetesExecutor pod route
  # hid this behind a fast non-zero exit with no visible traceback).
  driver:
    cores: 1
    memory: "1g"
    serviceAccount: spark-jobs
    labels:
      app: analytics-transform
    nodeSelector:
      workload-type: spark-driver
    tolerations:
      - key: workload-type
        operator: Equal
        value: spark-driver
        effect: NoSchedule
  executor:
    cores: 1
    instances: 1
    memory: "1g"
    labels:
      app: analytics-transform
    nodeSelector:
      workload-type: spark-executor
    tolerations:
      - key: workload-type
        operator: Equal
        value: spark-executor
        effect: NoSchedule
